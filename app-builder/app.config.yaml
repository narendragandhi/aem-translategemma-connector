application:
  actions: actions
  runtimeManifest:
    packages:
      aem-gemma:
        license: Apache-2.0
        actions:
          on-content-modified:
            function: actions/on-content-modified/index.js
            web: 'no'
            runtime: 'nodejs:22'
            inputs:
              aem_host: "$AEM_HOST"
              aem_token: "$AEM_TOKEN"
              LOG_LEVEL: "$LOG_LEVEL"
            annotations:
              require-adobe-auth: true
              final: true
          submit-feedback:
            function: actions/submit-feedback/index.js
            web: 'yes'
            runtime: 'nodejs:22'
            inputs:
              aem_host: "$AEM_HOST"
              LOG_LEVEL: "$LOG_LEVEL"
            annotations:
              require-adobe-auth: true
              final: true
